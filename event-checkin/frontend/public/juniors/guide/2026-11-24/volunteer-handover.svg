<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980" role="img" aria-label="Every volunteer. Every safe handover."><title>Every volunteer. Every safe handover.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#126e63"/></marker></defs><rect width="1400" height="1980" fill="#f5f9f7"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="225" rx="0" fill="#123138" stroke="#123138" stroke-width="2"/><text x="70" y="58" font-size="22" font-weight="700" fill="#95dfc7"><tspan x="70" dy="0">FESTIO JUNIORS / VOLUNTEER ORIENTATION</tspan></text><text x="70" y="127" font-size="49" font-weight="700" fill="white"><tspan x="70" dy="0">Every volunteer. Every safe handover.</tspan></text><text x="70" y="181" font-size="25" font-weight="400" fill="#d4e8e2"><tspan x="70" dy="0">Your recorded handoff keeps the whole programme moving calmly.</tspan></text><rect x="190" y="265" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="308" r="37" fill="#126e63"/><text x="88" y="318" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">01</tspan></text><text x="220" y="310" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Sign in and choose the event</tspan></text><text x="220" y="352" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Use the same verified email assigned by the Admin. On mobile: Home,</tspan><tspan x="220" dy="38">Children, Scan, My shift and More.</tspan></text><path d="M111 347V449" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="455" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="498" r="37" fill="#126e63"/><text x="88" y="508" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">02</tspan></text><text x="220" y="500" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Use only your assigned tools</tspan></text><text x="220" y="542" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Admin has full Juniors access in scope. Volunteers receive selected</tspan><tspan x="220" dy="38">permissions; own shifts and the guide remain available.</tspan></text><path d="M111 537V639" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="645" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="688" r="37" fill="#126e63"/><text x="88" y="698" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">03</tspan></text><text x="220" y="690" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Check in at your station</tspan></text><text x="220" y="732" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Open My shift. Check in only when physically present. A reminder or</tspan><tspan x="220" dy="38">scheduled shift is not attendance.</tspan></text><path d="M111 727V829" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="835" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="878" r="37" fill="#126e63"/><text x="88" y="888" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">04</tspan></text><text x="220" y="880" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Count and review together</tspan></text><text x="220" y="922" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Count the children. Review Clinic, Other, Outing, support and unresolved</tspan><tspan x="220" dy="38">movement records with the incoming volunteer.</tspan></text><path d="M111 917V1019" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="1025" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="1068" r="37" fill="#126e63"/><text x="88" y="1078" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">05</tspan></text><text x="220" y="1070" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Offer and accept the handover</tspan></text><text x="220" y="1112" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">The outgoing volunteer offers to the assigned incoming person. The</tspan><tspan x="220" dy="38">incoming volunteer checks in and accepts the current physical count.</tspan></text><path d="M111 1107V1209" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="1215" width="1130" height="200" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="1258" r="37" fill="#126e63"/><text x="88" y="1268" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">06</tspan></text><text x="220" y="1260" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Finish the outgoing shift</tspan></text><text x="220" y="1302" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">After accepted handover and the physical transfer, the outgoing volunteer</tspan><tspan x="220" dy="38">finishes the shift. If relief is late, alert the lead and remain with the</tspan><tspan x="220" dy="38">children.</tspan></text><rect x="70" y="1443" width="1260" height="190" rx="22" fill="#e4f4ee" stroke="#126e63" stroke-width="2"/><text x="96" y="1487" font-size="28" font-weight="700" fill="#126e63"><tspan x="96" dy="0">MESSAGES HAVE THEIR OWN STATUS</tspan></text><text x="96" y="1531" font-size="28" font-weight="700" fill="#123138"><tspan x="96" dy="0">Queued → Accepted → Delivered (only with a receipt)</tspan></text><text x="96" y="1575" font-size="24" font-weight="400" fill="#50686d"><tspan x="96" dy="0">Sending needs enabled switches, valid contacts, consent, provider readiness and credits. Practice</tspan><tspan x="96" dy="34">events never send.</tspan></text><text x="70" y="1940" font-size="20" font-weight="400" fill="#50686d"><tspan x="70" dy="0">STAFF ONLY · Event settings and permissions apply · Updated 2026-11-24</tspan></text></g></svg>