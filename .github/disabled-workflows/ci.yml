name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-checkin/backend
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential dump files
        run: |
          cd "$GITHUB_WORKSPACE"
          test -z "$(git ls-files -- 'event-checkin/meta token')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (tenant isolation, etc.)
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify OpenAPI snapshot and generated frontend types
        working-directory: event-checkin
        env:
          CONTRACT_EXPORT_MODE: local
          PYTHON_BIN: python
        run: frontend/scripts/check-api-contract-drift.sh

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-checkin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: event-checkin/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Test frontend consent and chat isolation
        run: node --test tests/*.test.mjs e2e/*.test.mjs
      - name: Check help content for broken media links and old branding
        run: npm run check:help-content
      - name: Validate Playwright suite discovery
        run: npx playwright test --list
      - name: Validate isolated engagement suite discovery
        run: npx playwright test --config playwright.engagement.config.js --list

  engagement-browser-tests:
    # Pin a supported VM with user-namespace sandbox support. Do not disable
    # Chromium's sandbox or change host security settings to make tests pass.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: event-checkin/frontend
    env:
      CI: "true"
      MARKETING_OUTBOUND_ENABLED: "false"
      MARKETING_SCHEDULER_ENABLED: "false"
      VITE_SALES_CHAT_ENABLED: "false"
      VITE_SALES_CHAT_INBOX_VALIDATED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: event-checkin/frontend/package-lock.json
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install matching official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify sandboxed isolated test configuration
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import config from './playwright.engagement.config.js'
          assert.deepEqual(config.use.launchOptions, { chromiumSandbox: true })
          assert.equal(config.use.serviceWorkers, 'block')
          assert.equal(config.use.baseURL, 'http://127.0.0.1:4178')
          assert.equal(config.testMatch, 'engagement-foundations.spec.js')
          assert.equal(config.webServer.reuseExistingServer, false)
          NODE
      - name: Run isolated engagement browser scenarios
        # This starts only the local fixture, not the app/backend or real providers.
        # Firebase/API calls are mocked; fake chat origins are fulfilled and all
        # other non-local requests are aborted before any network connection.
        run: npm run test:e2e:engagement
      - name: Upload fixture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-browser-failures
          path: event-checkin/frontend/test-results/engagement/
          retention-days: 7
          if-no-files-found: ignore

  marketing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-checkin/marketing-service
    env:
      MARKETING_OUTBOUND_ENABLED: "false"
      MARKETING_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test consent-safe automation and ingestion
        run: python -m pytest -q

  adapter-auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [dashboard, support, messaging, setup]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install selected adapter and isolated test dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: pip install -r "event-checkin/$SERVICE-service/requirements.txt" pytest pytest-asyncio aiosqlite httpx
      - name: Test real adapter identity boundaries without providers
        env:
          FESTIO_ADAPTER_SERVICE: ${{ matrix.service }}
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          cd "$(mktemp -d)"
          python -m pytest -q -p pytest_asyncio.plugin -p no:cacheprovider "$GITHUB_WORKSPACE/event-checkin/adapter-auth-tests"
      - name: Run existing adapter tests in isolated local fixtures
        env:
          SERVICE: ${{ matrix.service }}
        run: python event-checkin/adapter-auth-tests/run_isolated.py "$SERVICE"
      - name: Test required read-only Dashboard configuration
        if: matrix.service == 'dashboard'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          cd "$(mktemp -d)"
          python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/event-checkin/dashboard-service/config_tests"

  scoped-release-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify scoped release safety offline
        run: python3 -m unittest discover -s .github/tests -p 'test_scoped_release.py' -v

  ticketing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-checkin/ticketing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: event-checkin/ticketing-service/requirements.txt
      - name: Install ticketing test dependencies
        run: pip install -r requirements.txt pytest aiosqlite
      - name: Test ticketing routing, refunds and Stripe-managed risk without live providers
        run: python -m pytest -q
