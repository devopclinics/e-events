<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FestioHub" />
    <link rel="manifest" href="/guesthub.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="/guesthub-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="description" content="Festio helps organizers create events, manage guests, collect RSVPs, send QR passes, assign seats, message attendees, control access, manage meals, and track attendance live." />
    <title>Festio — Guest Management for Modern Events</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Festio" />
    <meta property="og:title" content="Festio — Run every guest moment from invite to exit" />
    <meta property="og:description" content="Create events, manage guests, collect RSVPs, send QR passes, assign seats, message attendees, control access, manage meals, and track attendance live from one simple dashboard." />
    <meta property="og:url" content="https://festio.events/" />
    <meta property="og:image" content="/media/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Festio — Run every guest moment from invite to exit" />
    <meta name="twitter:description" content="Create events, manage guests, collect RSVPs, send QR passes, assign seats, message attendees, control access, manage meals, and track attendance live." />
    <meta name="twitter:image" content="/media/og-image.png" />
    <script>
      try {
        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch { /* Theme storage is optional. */ }
    </script>
    <script>
      // This must run before the module entry: React cannot recover if its own
      // entry bundle is unavailable during an update or a network interruption.
      (() => {
        const key = 'festio:startup-recovery';
        let retrying = false, timer;
        const pending = () => document.getElementById('festio-startup');
        function show(message) {
          const el = pending();
          if (!el) return;
          el.querySelector('[data-startup-message]').textContent = message;
          el.querySelector('button').hidden = false;
        }
        function recover(event) {
          if (!pending()) return;
          const target = event.target;
          if (event.type === 'error' && target !== window && target?.tagName !== 'SCRIPT') return;
          const entryFailed = target && target.tagName === 'SCRIPT' && target.type === 'module';
          if (!entryFailed) { show('Festio could not finish loading. Please reload the page.'); return; }
          if (retrying) return;
          if (!navigator.onLine) { show('You appear to be offline. Reconnect, then reload Festio.'); return; }
          let count = 0;
          try {
            const saved = JSON.parse(sessionStorage.getItem(key) || 'null');
            if (saved && Date.now() - saved.startedAt < 120000) count = saved.count || 0;
            if (count >= 2) { show('Festio could not load the latest app files. Please reload to try again.'); return; }
            sessionStorage.setItem(key, JSON.stringify({count: count + 1, startedAt: saved && count ? saved.startedAt : Date.now()}));
          } catch { show('Festio could not load. Please reload to try again.'); return; }
          retrying = true;
          show('Reconnecting to the latest Festio version…');
          timer = setTimeout(() => { if (pending()) window.location.reload(); }, 1500 * (count + 1));
        }
        window.addEventListener('error', recover, true);
        window.addEventListener('unhandledrejection', recover);
        document.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          const cleanup = () => {
            if (pending()) return;
            clearTimeout(timer); observer.disconnect();
            window.removeEventListener('error', recover, true);
            window.removeEventListener('unhandledrejection', recover);
            try { sessionStorage.removeItem(key); } catch { /* optional storage */ }
          };
          const observer = new MutationObserver(cleanup);
          if (pending()) observer.observe(root, {childList: true});
          else cleanup();
          setTimeout(() => { if (!retrying) show('Festio is taking longer to load. Check your connection or reload the page.'); }, 15000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="festio-startup" style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f6f2;color:#18372f;font:16px/1.5 system-ui,sans-serif">
      <div style="max-width:440px;text-align:center"><h1 style="font-size:28px">Festio</h1><p role="status" data-startup-message>Loading your event experience…</p><button hidden type="button" onclick="window.location.reload()" style="min-height:44px;padding:12px 24px;border:0;border-radius:10px;background:#124b3c;color:white;font:inherit;cursor:pointer">Reload Festio</button><noscript>Please enable JavaScript to use Festio.</noscript></div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
