<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980" role="img" aria-label="Programme &amp; gala childcare"><title>Programme &amp; gala childcare</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#126e63"/></marker></defs><rect width="1400" height="1980" fill="#f5f9f7"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="225" rx="0" fill="#123138" stroke="#123138" stroke-width="2"/><text x="70" y="58" font-size="22" font-weight="700" fill="#95dfc7"><tspan x="70" dy="0">FESTIO JUNIORS / VOLUNTEER ORIENTATION</tspan></text><text x="70" y="127" font-size="49" font-weight="700" fill="white"><tspan x="70" dy="0">Programme &amp; gala childcare</tspan></text><text x="70" y="181" font-size="25" font-weight="400" fill="#d4e8e2"><tspan x="70" dy="0">One shared timetable. Fresh custody for the evening session.</tspan></text><rect x="190" y="265" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="308" r="37" fill="#126e63"/><text x="88" y="318" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">01</tspan></text><text x="220" y="310" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Prepare and approve the programme</tspan></text><text x="220" y="352" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Programme → Programme setup: map Groups &amp; rooms, review Source &amp;</tspan><tspan x="220" dy="38">sessions, resolve questions and use Review &amp; publish.</tspan></text><path d="M111 347V449" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="455" width="1130" height="200" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="498" r="37" fill="#126e63"/><text x="88" y="508" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">02</tspan></text><text x="220" y="500" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Assign the team and guardian updates</tspan></text><text x="220" y="542" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">More → Volunteers: assign roles, permissions, classrooms and shifts. More</tspan><tspan x="220" dy="38">→ Settings: enable guardian updates when contacts and sending setup</tspan><tspan x="220" dy="38">are ready.</tspan></text><path d="M111 537V677" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="683" width="1130" height="200" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="726" r="37" fill="#126e63"/><text x="88" y="736" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">03</tspan></text><text x="220" y="728" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Use the right operational view</tspan></text><text x="220" y="770" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">My classroom shows your group and next activities. Programme shows</tspan><tspan x="220" dy="38">the timetable. More → Supervisor shows headcounts, coverage and</tspan><tspan x="220" dy="38">outstanding returns.</tspan></text><path d="M111 765V905" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="911" width="1130" height="200" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="954" r="37" fill="#126e63"/><text x="88" y="964" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">04</tspan></text><text x="220" y="956" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Begin a fresh gala handoff</tspan></text><text x="220" y="998" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">After daytime pickup, More → Gala childcare: find the same child, select</tspan><tspan x="220" dy="38">the gala session, verify the adult and confirm screening answers and</tspan><tspan x="220" dy="38">wristbands again.</tspan></text><path d="M111 993V1133" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="1139" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="1182" r="37" fill="#126e63"/><text x="88" y="1192" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">05</tspan></text><text x="220" y="1184" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Confirm the evening movements and pickup</tspan></text><text x="220" y="1226" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Record actual classroom arrival. Clinic, Other and Outing each need a</tspan><tspan x="220" dy="38">return. At final pickup, verify an authorized adult and confirm the handoff.</tspan></text><rect x="70" y="1334" width="1260" height="115" rx="22" fill="#e4f4ee" stroke="#126e63" stroke-width="2"/><text x="96" y="1377" font-size="27" font-weight="700" fill="#126e63"><tspan x="96" dy="0">SCHEDULED DOES NOT MEAN PRESENT</tspan></text><text x="96" y="1419" font-size="25" font-weight="400" fill="#50686d"><tspan x="96" dy="0">Every movement, return and handoff needs staff confirmation.</tspan></text><text x="70" y="1940" font-size="20" font-weight="400" fill="#50686d"><tspan x="70" dy="0">STAFF ONLY · Event settings and permissions apply · Updated 2026-11-25-r1</tspan></text></g></svg>