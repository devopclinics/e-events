<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Festio scanner outage procedure</title><desc id="desc">Prepare online, queue eligible general admission during a short outage, reconnect and review. Junior handoffs and daily or session attendance remain online.</desc><rect width="1000" height="520" rx="20" fill="#f0f7f4"/><g font-family="Arial,sans-serif" fill="#153e34"><text x="35" y="52" font-size="27" font-weight="bold">Prepare → Record → Reconcile</text><text x="35" y="84" font-size="18">Current operating procedure · October 6, 2026</text><rect x="35" y="125" width="270" height="225" rx="14" fill="white" stroke="#accbc1"/><text x="53" y="160" font-size="18" font-weight="bold">1. ONLINE PREPARATION</text><text x="53" y="205" font-size="16">Correct Active event</text><text x="53" y="237" font-size="16">Prepare this scanner</text><text x="53" y="269" font-size="16">Verify count + expiry</text><text x="53" y="301" font-size="16">30-minute saved manifest</text><rect x="365" y="125" width="270" height="225" rx="14" fill="white" stroke="#accbc1"/><text x="383" y="160" font-size="18" font-weight="bold">2. SHORT OUTAGE</text><text x="383" y="205" font-size="16">Keep the page open</text><text x="383" y="237" font-size="16">Eligible QR / manual admission</text><text x="383" y="269" font-size="16">Blue result = locally queued</text><text x="383" y="301" font-size="16">Duplicate checks: this device</text><rect x="695" y="125" width="270" height="225" rx="14" fill="white" stroke="#accbc1"/><text x="713" y="160" font-size="18" font-weight="bold">3. RECONNECT</text><text x="713" y="205" font-size="16">Sync saved check-ins</text><text x="713" y="237" font-size="16">Server revalidates every record</text><text x="713" y="269" font-size="16">Resolve Needs review</text><text x="713" y="301" font-size="16">Do not clear pending records</text><rect x="35" y="378" width="930" height="102" rx="12" fill="#fff3d7"/><text x="55" y="411" font-size="19" font-weight="bold">Keep protected operations online</text><text x="55" y="442" font-size="17">Guardian handoffs · daily/session attendance · check-out · live admission requirements</text><text x="55" y="466" font-size="15">No offline startup/reload or cross-device duplicate guarantee. Rehearse with the venue network.</text></g></svg>