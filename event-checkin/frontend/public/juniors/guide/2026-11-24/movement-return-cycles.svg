<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980" role="img" aria-label="Every movement needs a return"><title>Every movement needs a return</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#126e63"/></marker></defs><rect width="1400" height="1980" fill="#f5f9f7"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="225" rx="0" fill="#123138" stroke="#123138" stroke-width="2"/><text x="70" y="58" font-size="22" font-weight="700" fill="#95dfc7"><tspan x="70" dy="0">FESTIO JUNIORS / VOLUNTEER ORIENTATION</tspan></text><text x="70" y="127" font-size="49" font-weight="700" fill="white"><tspan x="70" dy="0">Every movement needs a return</tspan></text><text x="70" y="181" font-size="25" font-weight="400" fill="#d4e8e2"><tspan x="70" dy="0">Three complete cycles. No return record means the child is still away.</tspan></text><rect x="60" y="265" width="390" height="64" rx="16" fill="#126e63" stroke="#126e63" stroke-width="2"/><text x="84" y="309" font-size="30" font-weight="700" fill="white"><tspan x="84" dy="0">CLINIC</tspan></text><rect x="60" y="365" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="82" y="402" font-size="25" font-weight="700" fill="#123138"><tspan x="82" dy="0">Start at JP</tspan></text><text x="82" y="444" font-size="24" font-weight="400" fill="#50686d"><tspan x="82" dy="0">The child is physically at JP</tspan><tspan x="82" dy="34">reception, a desk or a</tspan><tspan x="82" dy="34">classroom.</tspan></text><path d="M255.0 549V566" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="60" y="573" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="82" y="610" font-size="25" font-weight="700" fill="#123138"><tspan x="82" dy="0">Record Clinic departure</tspan></text><text x="82" y="652" font-size="24" font-weight="400" fill="#50686d"><tspan x="82" dy="0">Enter the accompanying</tspan><tspan x="82" dy="34">adult and confirm</tspan><tspan x="82" dy="34">departure. The account and</tspan><tspan x="82" dy="34">time are recorded.</tspan></text><path d="M255.0 783V800" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="60" y="807" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="82" y="844" font-size="25" font-weight="700" fill="#123138"><tspan x="82" dy="0">Still at clinic</tspan></text><text x="82" y="886" font-size="24" font-weight="400" fill="#50686d"><tspan x="82" dy="0">The child remains away until</tspan><tspan x="82" dy="34">an actual return is recorded.</tspan></text><path d="M255.0 991V1008" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="60" y="1015" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="82" y="1052" font-size="25" font-weight="700" fill="#123138"><tspan x="82" dy="0">Record Return to JP</tspan></text><text x="82" y="1094" font-size="24" font-weight="400" fill="#50686d"><tspan x="82" dy="0">Choose Return from clinic /</tspan><tspan x="82" dy="34">other when the child is</tspan><tspan x="82" dy="34">physically back.</tspan></text><path d="M255.0 1225V1242" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="60" y="1249" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="82" y="1286" font-size="25" font-weight="700" fill="#123138"><tspan x="82" dy="0">Confirm classroom</tspan><tspan x="82" dy="32">arrival</tspan></text><text x="82" y="1360" font-size="24" font-weight="400" fill="#50686d"><tspan x="82" dy="0">If resuming class, record</tspan><tspan x="82" dy="34">arrival in the assigned room.</tspan></text><rect x="505" y="265" width="390" height="64" rx="16" fill="#126e63" stroke="#126e63" stroke-width="2"/><text x="529" y="309" font-size="30" font-weight="700" fill="white"><tspan x="529" dy="0">OTHER</tspan></text><rect x="505" y="365" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="527" y="402" font-size="25" font-weight="700" fill="#123138"><tspan x="527" dy="0">Start at JP</tspan></text><text x="527" y="444" font-size="24" font-weight="400" fill="#50686d"><tspan x="527" dy="0">The child is physically at JP</tspan><tspan x="527" dy="34">reception, a desk or a</tspan><tspan x="527" dy="34">classroom.</tspan></text><path d="M700.0 549V566" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="505" y="573" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="527" y="610" font-size="25" font-weight="700" fill="#123138"><tspan x="527" dy="0">Record Other departure</tspan></text><text x="527" y="652" font-size="24" font-weight="400" fill="#50686d"><tspan x="527" dy="0">Enter the adult and a</tspan><tspan x="527" dy="34">required internal reason.</tspan><tspan x="527" dy="34">This is not final pickup.</tspan></text><path d="M700.0 783V800" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="505" y="807" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="527" y="844" font-size="25" font-weight="700" fill="#123138"><tspan x="527" dy="0">Still temporarily away</tspan></text><text x="527" y="886" font-size="24" font-weight="400" fill="#50686d"><tspan x="527" dy="0">Do not assume the child is</tspan><tspan x="527" dy="34">back because time has</tspan><tspan x="527" dy="34">passed.</tspan></text><path d="M700.0 991V1008" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="505" y="1015" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="527" y="1052" font-size="25" font-weight="700" fill="#123138"><tspan x="527" dy="0">Record Return to JP</tspan></text><text x="527" y="1094" font-size="24" font-weight="400" fill="#50686d"><tspan x="527" dy="0">Choose Return from clinic /</tspan><tspan x="527" dy="34">other when the child is</tspan><tspan x="527" dy="34">physically back.</tspan></text><path d="M700.0 1225V1242" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="505" y="1249" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="527" y="1286" font-size="25" font-weight="700" fill="#123138"><tspan x="527" dy="0">Confirm classroom</tspan><tspan x="527" dy="32">arrival</tspan></text><text x="527" y="1360" font-size="24" font-weight="400" fill="#50686d"><tspan x="527" dy="0">If resuming class, record</tspan><tspan x="527" dy="34">arrival in the assigned room.</tspan></text><rect x="950" y="265" width="390" height="64" rx="16" fill="#126e63" stroke="#126e63" stroke-width="2"/><text x="974" y="309" font-size="30" font-weight="700" fill="white"><tspan x="974" dy="0">OUTING</tspan></text><rect x="950" y="365" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="972" y="402" font-size="25" font-weight="700" fill="#123138"><tspan x="972" dy="0">Prepare the roster</tspan></text><text x="972" y="444" font-size="24" font-weight="400" fill="#50686d"><tspan x="972" dy="0">Verify permission. Departure</tspan><tspan x="972" dy="34">requires the scheduled date</tspan><tspan x="972" dy="34">and a child in class.</tspan></text><path d="M1145.0 549V566" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="950" y="573" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="972" y="610" font-size="25" font-weight="700" fill="#123138"><tspan x="972" dy="0">Confirm outing</tspan><tspan x="972" dy="32">departure</tspan></text><text x="972" y="684" font-size="24" font-weight="400" fill="#50686d"><tspan x="972" dy="0">Open the named outing,</tspan><tspan x="972" dy="34">scan or find the child, then</tspan><tspan x="972" dy="34">confirm that outing.</tspan></text><path d="M1145.0 783V800" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="950" y="807" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="972" y="844" font-size="25" font-weight="700" fill="#123138"><tspan x="972" dy="0">Awaiting return</tspan></text><text x="972" y="886" font-size="24" font-weight="400" fill="#50686d"><tspan x="972" dy="0">Review the outing counts</tspan><tspan x="972" dy="34">and every child in Awaiting</tspan><tspan x="972" dy="34">return.</tspan></text><path d="M1145.0 991V1008" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="950" y="1015" width="390" height="206" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="972" y="1052" font-size="25" font-weight="700" fill="#123138"><tspan x="972" dy="0">Confirm outing return</tspan></text><text x="972" y="1094" font-size="24" font-weight="400" fill="#50686d"><tspan x="972" dy="0">Scan or open the child and</tspan><tspan x="972" dy="34">confirm return to that</tspan><tspan x="972" dy="34">outing. The child is back at</tspan><tspan x="972" dy="34">JP reception.</tspan></text><path d="M1145.0 1225V1242" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="950" y="1249" width="390" height="180" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><text x="972" y="1286" font-size="25" font-weight="700" fill="#123138"><tspan x="972" dy="0">Confirm classroom</tspan><tspan x="972" dy="32">arrival</tspan></text><text x="972" y="1360" font-size="24" font-weight="400" fill="#50686d"><tspan x="972" dy="0">If resuming class, record</tspan><tspan x="972" dy="34">arrival in the assigned room.</tspan></text><rect x="60" y="1590" width="1280" height="133" rx="22" fill="#e4f4ee" stroke="#126e63" stroke-width="2"/><text x="86" y="1633" font-size="27" font-weight="700" fill="#126e63"><tspan x="86" dy="0">LEAVING FOR THE DAY INSTEAD?</tspan></text><text x="86" y="1676" font-size="27" font-weight="400" fill="#50686d"><tspan x="86" dy="0">Record the return to JP first → verify an authorized adult → confirm final pickup.</tspan></text><rect x="60" y="1750" width="1280" height="135" rx="22" fill="#fff1d6" stroke="#d5ad65" stroke-width="2"/><text x="86" y="1795" font-size="29" font-weight="700" fill="#123138"><tspan x="86" dy="0">STOP: do not close an outing with outstanding returns.</tspan></text><text x="86" y="1840" font-size="26" font-weight="400" fill="#50686d"><tspan x="86" dy="0">Scanning identifies a child. Staff confirmation records the movement.</tspan></text><text x="70" y="1940" font-size="20" font-weight="400" fill="#50686d"><tspan x="70" dy="0">STAFF ONLY · Event settings and permissions apply · Updated 2026-11-24</tspan></text></g></svg>