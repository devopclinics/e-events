# Protect staff tools while preserving guest embeds on external event websites.
map $request_uri $staff_frame_options {
    default "";
    ~^/(guest-services|kitchen-redesign)(/|\?|$) SAMEORIGIN;
}
map $staff_frame_options $staff_frame_ancestors {
    default "";
    SAMEORIGIN "frame-ancestors 'self'";
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Applied in every location because nginx add_header inheritance is all-or-nothing.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Invitation URLs contain personal bearer credentials. Serve the SPA in
    # this location so privacy headers also apply before JavaScript loads.
    location ^~ /meeting-response/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $staff_frame_ancestors always;
        add_header X-Frame-Options $staff_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # A service worker must be revalidated on every browser visit. Caching it
    # as an immutable JavaScript asset prevents FestioHub updates and fixes from
    # reaching installed guests for up to a year.
    location = /guesthub-sw.js {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $staff_frame_ancestors always;
        add_header X-Frame-Options $staff_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /guest-services-sw.js {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $staff_frame_ancestors always;
        add_header X-Frame-Options $staff_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Never let a CDN retain missing build files during a rolling release.
    location @missing_asset {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $staff_frame_ancestors always;
        add_header X-Frame-Options $staff_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, max-age=0" always;
        return 404;
    }

    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $staff_frame_ancestors always;
        add_header X-Frame-Options $staff_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        error_page 404 = @missing_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
