<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980" role="img" aria-label="A safe day: arrival to pickup"><title>A safe day: arrival to pickup</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#126e63"/></marker></defs><rect width="1400" height="1980" fill="#f5f9f7"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1400" height="225" rx="0" fill="#123138" stroke="#123138" stroke-width="2"/><text x="70" y="58" font-size="22" font-weight="700" fill="#95dfc7"><tspan x="70" dy="0">FESTIO JUNIORS / VOLUNTEER ORIENTATION</tspan></text><text x="70" y="127" font-size="49" font-weight="700" fill="white"><tspan x="70" dy="0">A safe day: arrival to pickup</tspan></text><text x="70" y="181" font-size="25" font-weight="400" fill="#d4e8e2"><tspan x="70" dy="0">Convention admission first. A fresh drop-off and confirmation each JP day.</tspan></text><rect x="190" y="265" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="308" r="37" fill="#126e63"/><text x="88" y="318" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">01</tspan></text><text x="220" y="310" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Find or scan the child</tspan></text><text x="220" y="352" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Search the shared Guest List record. Scanning opens the record; it does</tspan><tspan x="220" dy="38">not record a movement.</tspan></text><path d="M111 347V449" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="455" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="498" r="37" fill="#126e63"/><text x="88" y="508" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">02</tspan></text><text x="220" y="500" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Complete convention check-in</tspan></text><text x="220" y="542" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Follow the configured JP start date. Convention arrival alone does not</tspan><tspan x="220" dy="38">begin JP custody.</tspan></text><path d="M111 537V639" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="645" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="688" r="37" fill="#126e63"/><text x="88" y="698" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">03</tspan></text><text x="220" y="690" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Record today’s drop-off</tspan></text><text x="220" y="732" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Choose the adult present; linked guardian details are prefilled. Verify in</tspan><tspan x="220" dy="38">person; a sibling must be 18+. Resolve any prior-day custody first.</tspan></text><path d="M111 727V829" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="835" width="1130" height="200" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="878" r="37" fill="#126e63"/><text x="88" y="888" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">04</tspan></text><text x="220" y="880" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Confirm screening and wristbands</tspan></text><text x="220" y="922" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Saved answers prefill. Ask what is missing and confirm both answers with</tspan><tspan x="220" dy="38">the adult today. Every child needs the standard band. Any Yes also</tspan><tspan x="220" dy="38">requires the relevant support desk and extra band.</tspan></text><path d="M111 917V1057" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="1063" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="1106" r="37" fill="#126e63"/><text x="88" y="1116" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">05</tspan></text><text x="220" y="1108" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Confirm classroom arrival</tspan></text><text x="220" y="1150" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Check the assigned room, required desk clearances and bands. Record</tspan><tspan x="220" dy="38">arrival when the child physically reaches the room.</tspan></text><path d="M111 1145V1247" stroke="#126e63" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="190" y="1253" width="1130" height="162" rx="22" fill="white" stroke="#cfdedb" stroke-width="2"/><circle cx="111" cy="1296" r="37" fill="#126e63"/><text x="88" y="1306" font-size="25" font-weight="700" fill="white"><tspan x="88" dy="0">06</tspan></text><text x="220" y="1298" font-size="31" font-weight="700" fill="#123138"><tspan x="220" dy="0">Verify the authorized collector</tspan></text><text x="220" y="1340" font-size="27" font-weight="400" fill="#50686d"><tspan x="220" dy="0">Choose an adult-verified, pickup-authorized collector. Check identity in</tspan><tspan x="220" dy="38">person, complete the handoff, then confirm final release.</tspan></text><rect x="70" y="1448" width="1260" height="115" rx="22" fill="#e4f4ee" stroke="#126e63" stroke-width="2"/><text x="96" y="1491" font-size="25" font-weight="700" fill="#126e63"><tspan x="96" dy="0">STANDARD + ALLERGY + ACCOMMODATION = 3 BANDS WHEN BOTH APPLY</tspan></text><text x="96" y="1531" font-size="24" font-weight="400" fill="#50686d"><tspan x="96" dy="0">Saved information does not carry daily clearance or band confirmation forward.</tspan></text><rect x="70" y="1588" width="1260" height="145" rx="22" fill="#fff1d6" stroke="#d5ad65" stroke-width="2"/><text x="96" y="1630" font-size="27" font-weight="700" fill="#123138"><tspan x="96" dy="0">NO AUTHORIZED COLLECTOR?</tspan></text><text x="96" y="1671" font-size="24" font-weight="400" fill="#50686d"><tspan x="96" dy="0">Admin / guardian-editor → Review collector authorization. This blocks final pickup, not drop-off or</tspan><tspan x="96" dy="34">screening. The drop-off record does not grant pickup permission.</tspan></text><text x="70" y="1940" font-size="20" font-weight="400" fill="#50686d"><tspan x="70" dy="0">STAFF ONLY · Event settings and permissions apply · Updated 2026-11-24</tspan></text></g></svg>